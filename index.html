<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Verb Memory</title>

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <main class="app">
      <header class="app-header">
        <h1>Verb Memory</h1>
        <p>Practice English verbs while playing.</p>
      </header>

      <section class="game-container">
        <div class="game-topbar">
          <div>
            <h2>Verb Memory</h2>
            <p>Practice English verbs by finding the correct pairs.</p>
          </div>
        </div>

        <div class="game-settings" id="game-settings">
          <div class="setting-group">
            <h3>Verb type</h3>

            <label>
              <input type="radio" name="verb-type" value="regular" />
              Regular
            </label>

            <label>
              <input type="radio" name="verb-type" value="irregular" />
              Irregular
            </label>

            <label>
              <input type="radio" name="verb-type" value="all" checked />
              All
            </label>
          </div>

          <div class="setting-group">
            <h3>Number of verbs</h3>

            <label>
              <input type="radio" name="verb-amount" value="5" checked />
              5
            </label>

            <label>
              <input type="radio" name="verb-amount" value="10" />
              10
            </label>

            <label>
              <input type="radio" name="verb-amount" value="15" />
              15
            </label>
          </div>

          <div class="setting-group">
            <h3>Practice mode</h3>

            <label>
              <input
                type="radio"
                name="practice-mode"
                value="spanish"
                checked
              />
              Infinitive ↔ Spanish
            </label>

            <label>
              <input type="radio" name="practice-mode" value="past" />
              Infinitive ↔ Past
            </label>

            <label>
              <input type="radio" name="practice-mode" value="participle" />
              Infinitive ↔ Past Participle
            </label>

            <label>
              <input type="radio" name="practice-mode" value="gerund" />
              Infinitive ↔ Gerund
            </label>
          </div>
        </div>

        <div class="game-actions">
          <button id="start-button">Start Game</button>

          <button id="reset-progress-button">Reset Progress</button>
        </div>

        <div id="current-game-info" class="current-game-info hidden"></div>

        <div class="game-stats">
          <p>
            Attempts:
            <span id="attempts">0</span>
          </p>

          <p>
            Pairs:
            <span id="pairs">0</span>
            /
            <span id="total-pairs">5</span>
          </p>
        </div>

        <div id="game-board" class="game-board"></div>

        <div id="victory-message" class="victory-message hidden">
          <h2>Game completed!</h2>

          <p>
            Attempts:
            <span id="final-attempts">0</span>
          </p>

          <div id="review-section" class="review-section hidden">
            <h3>Verbs to review</h3>

            <ul id="review-list"></ul>

            <button id="practice-difficult-button">
              Practice difficult verbs
            </button>
          </div>

          <button id="play-again-button">Play Again</button>
        </div>
      </section>
    </main>

    <script src="js/verbs.js"></script>
    <script src="js/game.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
